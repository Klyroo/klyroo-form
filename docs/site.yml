# Settings of the documentation site of Klyroo.Form, published at https://klyroo.github.io/klyroo-form/ by .github/workflows/docs.yml.
# Every setting is optional. The site reads README.md (home page) and docs/*.md (pages) as they are, with no front matter: a page title is its first # heading,
# a description its first paragraph. This file only adds what the Markdown cannot say. Preview it with the command in the CONTRIBUTING.md of klyroo-stack.

# The name in the header and on the home page. Without it: the first heading of README.md.
title: Klyroo.Form

# The line under the title on the home page. Without it: the first paragraph of README.md.
tagline: Schema-driven forms, validation and wizards for .NET developers, with a headless engine and Blazor components

# The command next to the title on the home page.
install: dotnet add package Klyroo.Form --prerelease

# The NuGet packages linked from the header.
packages:
  - Klyroo.Form.Core
  - Klyroo.Form
  - Klyroo.Form.DataAnnotations

# The home page. headline is two lines, the second in the accent color; lead is the paragraph under it. Without them: the title and the tagline.
headline: |
  Forms typed from
  your C# model.
lead: >-
  Declare a form from a C# model with FormSchema.For<TModel>: typed fields, rules, conditions and steps, on a controller with no UI dependency.

# The accent of the site (#rrggbb): buttons, links, marks and the second line of the headline. The text variants that pass the contrast rules in light and
# dark mode are computed from it. Without it: the color of the library in klyroo-stack/docs-site/Klyroo.Docs.Site/libraries.yml.
accent: "#f59e0b"


# What the hero demonstrates. Either board: table | form (a board with feature chips and several results, authored in docs-site), or a simple hero: the code,
# the lines the leader line starts at (focus) and one result (output: lines of text, or preview: ui-settings | display-stat | spreadsheet-rows).
demo:
  board: form

# The pages in the order of the navigation. docs/README.md comes first, as "Documentation". A page that is not listed follows, by file name.
# An entry is a file name below docs/ without .md, or a map with page and any of: title, navTitle, description, tocDepth, indexText. A group has a group name and its pages.
nav:
  - group: Tutorial
    pages:
      - getting-started
  - group: How-to guides
    pages:
      - guides
      - runtime-forms
  - group: Reference
    pages:
      - page: api-reference
        description: Every public type and member, generated from the compiled assemblies and their XML documentation.
        tocDepth: 4        # the table of contents lists the types, not only the packages and kinds
        indexText: false   # the search finds the types by their headings, without the text of the page
      - platforms
      - faq
  - group: Explanation
    pages:
      - concepts
  - group: Internals
    pages:
      - page: internal-contract
        title: Internal contract (for contributors)
        navTitle: Internal contract
        description: How the engine, the node tree and the codec work inside Klyroo.Form.Core. For contributors and for code that builds on the internals, not needed to use the library.
